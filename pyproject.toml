# Python package for the FHIR loader, with the tools used to test it.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-to-omop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "dbt-core>=1.12,<1.13", "dbt-postgres>=1.9"]
ml = ["flwr[simulation]>=1.42,<2", "scikit-learn>=1.5", "numpy>=2", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
